[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "dtool-s3"
description = "Add S3 support to dtool"
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "Tjelvar Olsson", email = "tjelvar.olsson@gmail.com"}
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "click",
    "dtoolcore>=3.17",
    "dtool_cli",
    "boto3",
    "packaging",
]

[project.optional-dependencies]
test = [
    "dtool-http",
    "pytest",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/jic-dtool/dtool-s3"

[project.entry-points."dtool.storage_brokers"]
S3StorageBroker = "dtool_s3.storagebroker:S3StorageBroker"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "dtool_s3/version.py"

[tool.hatch.build.targets.wheel]
packages = ["dtool_s3"]

[tool.hatch.build.targets.sdist]
exclude = [".github", ".pre-commit-config.yaml", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=dtool_s3 --cov-report=term-missing"
